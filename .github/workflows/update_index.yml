name: Update page index

on:
  schedule:
    - cron: "15 0 * * 1"
    - cron: "15 0 * * 3"
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Force a full rebuild"
        type: boolean
        default: false

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            /tmp/fastembed_cache
          key: fastembed-bge-small-en-v1.5-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build or update the index
        run: |
          if [ "${{ github.event.inputs.full_rebuild }}" = "true" ]; then
            python -m indexer.build_index
          else
            python -m indexer.update_index
          fi

      - name: Show what was produced
        run: |
          python - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("data/manifest.json").read_text())
          print("pages:", m["pages"], "chunks:", m["chunks"])
          print("model:", m["model_name"], "faiss:", m["faiss_version"])
          PY

      - name: Commit updated artifacts
        run: |
          git config user.name  "binaytara-index-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Index update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      - name: Redeploy the app (paid-host migration path only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: python -m indexer.notify_space
